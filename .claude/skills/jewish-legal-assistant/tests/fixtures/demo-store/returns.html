<h1>מדיניות החזרות וביטול עסקה</h1>
<p>ניתן לבטל עסקה תוך 14 יום מקבלת המוצר. בביטול שלא בשל פגם ייגבו דמי ביטול של 5% ממחיר העסקה או 100 ש"ח, לפי הנמוך.</p>
<p>אזרחים ותיקים, עולים חדשים ואנשים עם מוגבלות רשאים לבטל תוך 4 חודשים כשהעסקה כללה שיחה עם נציג.</p>
